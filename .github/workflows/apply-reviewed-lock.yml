name: Apply reviewed recovery lockfile once
on:
  push:
    branches: [fix/frozen-pilot-reload-race-20261003]
    paths: [.github/workflows/apply-reviewed-lock.yml]
permissions:
  contents: read
jobs:
  apply-reviewed-patch:
    if: github.ref == 'refs/heads/fix/frozen-pilot-reload-race-20261003'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const crypto = require('node:crypto');
            const branch = 'fix/frozen-pilot-reload-race-20261003';
            const coordinates = {owner: context.repo.owner, repo: context.repo.repo};
            const {data: file} = await github.rest.repos.getContent({...coordinates, path: 'package-lock.json', ref: context.sha});
            if (file.sha !== 'dd40a7c438776337a004216e7357976eb485d4ef') throw new Error('Original lockfile changed; refuse patch');
            const lock = JSON.parse(Buffer.from(file.content, 'base64').toString('utf8'));
            const changes = [
              ['dompurify','3.4.11','3.4.16','sha512-sqo+pNp3qRhCIpbgRi1y8Tgk27Bo2Ry7w0dC1NBeNTdZChWjz9Xb/KOoZbRP/R6pQZ80Qw8YhXw13hWWBbMRnQ=='],
              ['fflate','0.8.2','0.8.3','sha512-tbZNuJrLwGUp3zshBtdy4W+ORxZuIh8a5ilyIEQDC5rY1f3U20JMry0Ll3WBzU58EZKsEuJFXhb5gwv8CsPvgA=='],
              ['nanoid','3.3.16','3.3.19','sha512-Y2tUNy4ouw6tq5oDSKeQYGOyhkUBhNOcGV/02KC+6kd9eDGqdZd++mjMiIDilrBYvjEnCYvVtsuHCuP+okSfug=='],
              ['postcss','8.5.18','8.5.28','sha512-RRuzqDtt5Y9h3quz5hWhK+TPnsmVs6WwSU6LkJMeY4HstUEDuYTG8UJSdawMRzmzAtV+KEoG8N3Qg2qLy5vM/A==']
            ];
            for (const [name,before,after,integrity] of changes) {
              const p = lock.packages['node_modules/' + name];
              if (p.version !== before) throw new Error('Unexpected version: ' + name);
              p.version = after;
              p.resolved = `https://registry.npmjs.org/${name}/-/${name}-${after}.tgz`;
              p.integrity = integrity;
            }
            if (lock.packages['node_modules/postcss'].dependencies.nanoid !== '^3.3.12') throw new Error('Unexpected PostCSS dependency');
            lock.packages['node_modules/postcss'].dependencies.nanoid = '^3.3.18';
            const content = JSON.stringify(lock, null, 4) + '\n';
            const digest = crypto.createHash('sha256').update(content).digest('hex');
            if (digest !== 'ab42f255af7015d6c6d11879e9575aa9c9b49fd8c48058865a6d34a3a4d79ae0') throw new Error('Proposed lock differs from reviewed npm artifact');
            const {data: current} = await github.rest.repos.getBranch({...coordinates, branch});
            if (current.commit.sha !== context.sha) throw new Error('Branch moved; refuse concurrent update');
            const {data: result} = await github.rest.repos.createOrUpdateFileContents({...coordinates, path: 'package-lock.json', branch, sha: file.sha, content: Buffer.from(content).toString('base64'), message: 'Patch four reviewed transitive dependencies; preserve direct manifests and model sources'});
            core.info(JSON.stringify({commit: result.commit.sha, blob: result.content.sha, sha256: digest}));
