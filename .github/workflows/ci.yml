name: CI

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact pull-request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Capture immutable build identity
        run: echo "VITE_BUILD_ID=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser dependencies
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run unit and static tests
        run: npm test

      - name: Verify WebKit storage-failure submit stability
        run: npm run test:e2e -- tests/e2e/right-sizing-governance.spec.js -g "a failed asserted-record save" --project=webkit --repeat-each=5

      - name: Upload storage-failure interaction evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: storage-interaction-${{ github.event.pull_request.head.sha || github.sha }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 3

      - name: Run full Chromium e2e suite
        id: chromium_e2e
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: playwright-results.json
        run: npm run test:e2e -- --project=chromium --reporter=list,json

      - name: Upload Chromium failure evidence
        if: failure() && steps.chromium_e2e.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: chromium-failure-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            playwright-results.json
            test-results/
          if-no-files-found: warn
          retention-days: 3

      - name: Upload synthetic usability screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: usability-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: test-results/**/*.png
          if-no-files-found: ignore
          retention-days: 3

      - name: Run Firefox and WebKit critical-path smoke
        id: cross_browser_e2e
        run: >-
          npx playwright test
          tests/e2e/accessibility-navigation.spec.js
          tests/e2e/assessment-integrity.spec.js
          tests/e2e/right-sizing-governance.spec.js
          tests/e2e/help-navigation.spec.js
          tests/e2e/usability-report.spec.js
          tests/e2e/reference-controls.spec.js
          --project=firefox
          --project=webkit

      - name: Upload cross-browser failure evidence
        if: failure() && steps.cross_browser_e2e.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: cross-browser-failure-${{ github.event.pull_request.head.sha || github.sha }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 3

      - name: Build production bundle
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev
